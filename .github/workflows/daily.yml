name: daily-volume

on:
  schedule:
    # 9:07 UTC = 4am CDT (summer). GitHub cron is UTC and ignores DST; bump to
    # "7 10 * * *" (10:07 UTC) after the Nov 2026 DST change to hold 4am CST.
    # The :07 offset is deliberate, not a typo - GitHub's own docs warn that
    # scheduled runs queued for the top of the hour (:00) see the worst delays
    # under load, and this repo's runs were observed firing 2-5 hours late
    # every day while pinned to "0 10 * * *". Even with the offset, a slow day
    # for the Kalshi sports pull (it walks every active series' trade history)
    # can push actual completion / Drive sync well past the start time - the
    # cron fires on schedule, but "done" isn't instant.
    # Note: at this hour some venues' prior-day reports (esp. DKeX, which
    # finalises ~noon ET) may still be preliminary - the RECHECK_DAYS re-pull
    # corrects the trailing 3 days on the next morning's run.
    - cron: "7 9 * * *"
  workflow_dispatch: {}        # "Run workflow" button for manual / first runs

permissions:
  contents: write             # commit the refreshed CSV/xlsx/html back to the repo

concurrency:
  group: daily-volume
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the commit-back / rebase works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Python deps
        run: pip install --quiet openpyxl pdfplumber requests

      - name: Run the pipeline
        run: python run_all.py
        continue-on-error: true   # a transient source failure shouldn't block commit / upload

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || { echo "nothing to commit"; exit 0; }
          git fetch origin main
          # Reapply this commit on top of whatever's on origin. If that conflicts
          # (someone pushed code that touches the same generated files), abandon
          # this run's commit rather than ever committing conflict markers - the
          # data is regenerated wholesale next run anyway.
          if ! git rebase origin/main; then
            echo "::warning::rebase conflict - skipping commit this run, data refreshes next run"
            git rebase --abort
            exit 0
          fi
          git push

      # --- copy outputs to Google Drive so a second computer can open them ---
      # Needs a repo secret RCLONE_CONF = the full contents of your rclone.conf
      # (the [gdrive] block). Skipped automatically if the secret isn't set.
      - name: Push to Google Drive
        if: ${{ env.RCLONE_CONF != '' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          for f in unified_sports_volume.xlsx unified_sports_volume.csv dashboard.html VOLUME_METHODOLOGY.md; do
            [ -f "$f" ] && rclone copy "$f" gdrive:SportsVolume --no-traverse
          done
          echo "pushed to gdrive:SportsVolume"
