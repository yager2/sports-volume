name: daily-volume

on:
  schedule:
    # 06:17 UTC = 12:17am CST / 1:17am CDT - just after the US-Eastern day ends.
    # GitHub starts this repo's scheduled runs hours late (observed 6-12h late in
    # Nov 2026), so it is requested early to land by morning-to-midday Central.
    # An exact start time needs an external trigger calling workflow_dispatch.
    # Note: at this hour some venues' prior-day reports (esp. DKeX, which
    # finalises ~noon ET) may still be preliminary - the RECHECK_DAYS re-pull
    # corrects the trailing 3 days on the next morning's run.
    - cron: "17 6 * * *"
  workflow_dispatch: {}        # "Run workflow" button for manual / first runs

permissions:
  contents: write             # commit the refreshed CSV/xlsx/html back to the repo

concurrency:
  group: daily-volume
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the commit-back / rebase works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Python deps
        run: pip install --quiet openpyxl pdfplumber requests

      - name: Run the pipeline
        id: pipeline
        run: python run_all.py
        timeout-minutes: 155      # run_all.py also caps each step; this is the backstop
        continue-on-error: true   # a transient source failure shouldn't block commit / upload

      - name: Commit refreshed data
        if: ${{ always() }}       # land whatever refreshed even if the pipeline was killed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || { echo "nothing to commit"; exit 0; }
          git fetch origin main
          # Reapply this commit on top of whatever's on origin. If that conflicts
          # (someone pushed code that touches the same generated files), abandon
          # this run's commit rather than ever committing conflict markers - the
          # data is regenerated wholesale next run anyway.
          if ! git rebase origin/main; then
            echo "::warning::rebase conflict - skipping commit this run, data refreshes next run"
            git rebase --abort
            exit 0
          fi
          git push

      # --- copy outputs to Google Drive so a second computer can open them ---
      # Needs a repo secret RCLONE_CONF = the full contents of your rclone.conf
      # (the [gdrive] block). Skipped automatically if the secret isn't set.
      - name: Push to Google Drive
        if: ${{ env.RCLONE_CONF != '' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          for f in unified_sports_volume.xlsx unified_sports_volume.csv dashboard.html VOLUME_METHODOLOGY.md; do
            [ -f "$f" ] && rclone copy "$f" gdrive:SportsVolume --no-traverse
          done
          echo "pushed to gdrive:SportsVolume"

      # Runs last so good data is already committed. Turns the run red (GitHub
      # emails the owner) when a step failed or any venue has gone stale -
      # before this, broken sources still showed as "success".
      - name: Health check
        if: ${{ always() }}
        run: |
          python check_freshness.py
          if [ "${{ steps.pipeline.outcome }}" != "success" ]; then
            echo "::error::a pipeline step failed - see the 'Run the pipeline' log summary"
            exit 1
          fi
